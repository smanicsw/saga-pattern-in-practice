services:
  order:
    working_dir: /app
    environment:
      NODE_ENV: development
    volumes:
      - ./:/app
    command:
      - sh
      - -c
      - |
        until corepack pnpm --filter @saga/order-service db:migrate:latest; do
          echo "Waiting for order-db and retrying migrations..."
          sleep 2
        done
        corepack pnpm --filter @saga/order-service exec tsx watch src/index.ts

  payments:
    working_dir: /app
    environment:
