services:
  order:
    working_dir: /app
    environment:
      NODE_ENV: development
      EXPOSE_ERROR_DETAILS: "true"
    volumes:
      - ./:/app
    command:
      - sh
      - -c
      - |
        corepack pnpm --filter @saga/http-kit build
        corepack pnpm --filter @saga/outbox-kit build
        until corepack pnpm --filter @saga/order-service db:migrate:latest; do
          echo "Waiting for order-db and retrying migrations..."
          sleep 2
        done
        corepack pnpm --filter @saga/order-service exec tsx watch src/index.ts

  order-outbox-worker:
    working_dir: /app
    environment:
      NODE_ENV: development
    volumes:
      - ./:/app
    command:
      - sh
      - -c
      - |
        corepack pnpm --filter @saga/http-kit build
        corepack pnpm --filter @saga/outbox-kit build
        corepack pnpm --filter @saga/order-service outbox:worker

  order-saga-worker:
    working_dir: /app
    environment:
      NODE_ENV: development
    volumes:
      - ./:/app
    command:
      - sh
      - -c
      - |
        corepack pnpm --filter @saga/http-kit build
        corepack pnpm --filter @saga/outbox-kit build
        until corepack pnpm --filter @saga/order-saga-service db:migrate:latest; do
          echo "Waiting for order-saga-db and retrying migrations..."
          sleep 2
        done
        corepack pnpm --filter @saga/order-saga-service orchestrator:worker

