services:
  order:
    build:
      context: .
      args:
        SERVICE: order
    environment:
      NODE_ENV: ${NODE_ENV}
      ORDER_SERVICE_PORT: ${ORDER_SERVICE_PORT}
      DATABASE_URL: ${ORDER_DATABASE_URL}
      INVENTORY_SERVICE_BASE_URL: ${INVENTORY_SERVICE_BASE_URL}
    ports:
      - "${ORDER_SERVICE_PORT}:${ORDER_SERVICE_PORT}"
    depends_on:
      order-db:
        condition: service_healthy
    command:
      - sh
      - -c
      - |
        until node_modules/.bin/knex migrate:latest --knexfile knexfile.cjs; do
          echo "Waiting for order-db and retrying migrations..."
          sleep 2
        done
        node dist/index.js

  payments:
    build:
      context: .
      args:
        SERVICE: payments
    environment:
      NODE_ENV: ${NODE_ENV}
      PAYMENT_SERVICE_PORT: ${PAYMENT_SERVICE_PORT}
      DATABASE_URL: ${PAYMENT_DATABASE_URL}
    ports:
      - "${PAYMENT_SERVICE_PORT}:${PAYMENT_SERVICE_PORT}"
    depends_on:
      payments-db:
        condition: service_healthy
    command:
      - sh
      - -c
      - |
        until node_modules/.bin/knex migrate:latest --knexfile knexfile.cjs; do
          echo "Waiting for payments-db and retrying migrations..."
          sleep 2
        done
        node dist/index.js

  payments-outbox-worker:
    build:
      context: .
      args:
        SERVICE: payments
    environment:
      NODE_ENV: ${NODE_ENV}
      DATABASE_URL: ${PAYMENT_DATABASE_URL}
    depends_on:
      payments-db:
        condition: service_healthy
    command:
      - sh
      - -c
      - |
        until node_modules/.bin/knex migrate:latest --knexfile knexfile.cjs; do
          echo "Waiting for payments-db and retrying migrations..."
          sleep 2
        done
        node dist/outbox/worker.js

  inventory:
    build:
      context: .
      args:
        SERVICE: inventory
    environment:
      NODE_ENV: ${NODE_ENV}
      INVENTORY_SERVICE_PORT: ${INVENTORY_SERVICE_PORT}
      DATABASE_URL: ${INVENTORY_DATABASE_URL}
    ports:
      - "${INVENTORY_SERVICE_PORT}:${INVENTORY_SERVICE_PORT}"
    depends_on:
      inventory-db:
        condition: service_healthy
    command:
      - sh
      - -c
      - |
        until node_modules/.bin/knex migrate:latest --knexfile knexfile.cjs; do
          echo "Waiting for inventory-db and retrying migrations..."
          sleep 2
        done
        node dist/index.js

  inventory-outbox-worker:
    build:
      context: .
      args:
        SERVICE: inventory
    environment:
      NODE_ENV: ${NODE_ENV}
      DATABASE_URL: ${INVENTORY_DATABASE_URL}
    depends_on:
      inventory-db:
        condition: service_healthy
    command:
      - sh
      - -c
      - |
        until node_modules/.bin/knex migrate:latest --knexfile knexfile.cjs; do
          echo "Waiting for inventory-db and retrying migrations..."
          sleep 2
        done
        node dist/outbox/worker.js

  order-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${ORDER_DB_USER}
      POSTGRES_PASSWORD: ${ORDER_DB_PASSWORD}
      POSTGRES_DB: ${ORDER_DB_NAME}
    ports:
      - "${ORDER_DB_HOST_PORT}:5432"
    volumes:
      - order-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ORDER_DB_USER} -d ${ORDER_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 20

  payments-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${PAYMENTS_DB_USER}
      POSTGRES_PASSWORD: ${PAYMENTS_DB_PASSWORD}
      POSTGRES_DB: ${PAYMENTS_DB_NAME}
    ports:
      - "${PAYMENTS_DB_HOST_PORT}:5432"
    volumes:
      - payments-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PAYMENTS_DB_USER} -d ${PAYMENTS_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 20

  inventory-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${INVENTORY_DB_USER}
      POSTGRES_PASSWORD: ${INVENTORY_DB_PASSWORD}
      POSTGRES_DB: ${INVENTORY_DB_NAME}
    ports:
      - "${INVENTORY_DB_HOST_PORT}:5432"
    volumes:
      - inventory-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${INVENTORY_DB_USER} -d ${INVENTORY_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  order-db-data:
  payments-db-data:
  inventory-db-data:
