services:
  order:
    build:
      context: .
      args:
        SERVICE: order
    environment:
      NODE_ENV: ${NODE_ENV}
      ORDER_SERVICE_PORT: ${ORDER_SERVICE_PORT}
      DATABASE_URL: ${ORDER_DATABASE_URL}
      INVENTORY_SERVICE_BASE_URL: ${INVENTORY_SERVICE_BASE_URL:-http://inventory:3003}
      PAYMENTS_SERVICE_BASE_URL: ${PAYMENTS_SERVICE_BASE_URL:-http://payments:3002}
      KAFKA_BROKERS: ${KAFKA_BROKERS:-kafka:29092}
    ports:
      - "${ORDER_SERVICE_PORT}:${ORDER_SERVICE_PORT}"
    depends_on:
      order-db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:'+process.env.ORDER_SERVICE_PORT+'/api/v1/order/health').then((response)=>process.exit(response.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
    command:
      - sh
      - -c
      - |
        until node_modules/.bin/knex migrate:latest --knexfile knexfile.cjs; do
          echo "Waiting for order-db and retrying migrations..."
          sleep 2
        done
        node dist/index.js

  order-outbox-worker:
    build:
      context: .
      args:
        SERVICE: order
    environment:
      NODE_ENV: ${NODE_ENV}
      DATABASE_URL: ${ORDER_DATABASE_URL}
      INVENTORY_SERVICE_BASE_URL: ${INVENTORY_SERVICE_BASE_URL:-http://inventory:3003}
      PAYMENTS_SERVICE_BASE_URL: ${PAYMENTS_SERVICE_BASE_URL:-http://payments:3002}
      KAFKA_BROKERS: ${KAFKA_BROKERS:-kafka:29092}
    depends_on:
      order:
        condition: service_healthy
      kafka:
        condition: service_healthy
    command:
      - sh
      - -c
      - |
        node dist/outbox/worker.js

  order-orchestrator-worker:
    build:
      context: .
      args:
        SERVICE: order
    environment:
      NODE_ENV: ${NODE_ENV}
      DATABASE_URL: ${ORDER_DATABASE_URL}
      INVENTORY_SERVICE_BASE_URL: ${INVENTORY_SERVICE_BASE_URL:-http://inventory:3003}
      PAYMENTS_SERVICE_BASE_URL: ${PAYMENTS_SERVICE_BASE_URL:-http://payments:3002}
      KAFKA_BROKERS: ${KAFKA_BROKERS:-kafka:29092}
      KAFKA_ORDER_ORCHESTRATOR_GROUP_ID: ${KAFKA_ORDER_ORCHESTRATOR_GROUP_ID:-order-saga-orchestrator}
    depends_on:
      order:
        condition: service_healthy
      kafka:
        condition: service_healthy
    command:
      - sh
      - -c
      - |
        node dist/orchestrator/worker.js

  payments:
    build:
      context: .
      args:
        SERVICE: payments
    environment:
      NODE_ENV: ${NODE_ENV}
      PAYMENT_SERVICE_PORT: ${PAYMENT_SERVICE_PORT}
      DATABASE_URL: ${PAYMENT_DATABASE_URL}
      KAFKA_BROKERS: ${KAFKA_BROKERS:-kafka:29092}
    ports:
      - "${PAYMENT_SERVICE_PORT}:${PAYMENT_SERVICE_PORT}"
    depends_on:
      payments-db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:'+process.env.PAYMENT_SERVICE_PORT+'/api/v1/payments/health').then((response)=>process.exit(response.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
    command:
      - sh
      - -c
      - |
        until node_modules/.bin/knex migrate:latest --knexfile knexfile.cjs; do
          echo "Waiting for payments-db and retrying migrations..."
          sleep 2
        done
        node dist/index.js

  payments-outbox-worker:
    build:
      context: .
      args:
        SERVICE: payments
    environment:
      NODE_ENV: ${NODE_ENV}
      DATABASE_URL: ${PAYMENT_DATABASE_URL}
      KAFKA_BROKERS: ${KAFKA_BROKERS:-kafka:29092}
    depends_on:
      payments:
        condition: service_healthy
      kafka:
        condition: service_healthy
    command:
      - sh
      - -c
      - |
        node dist/outbox/worker.js

  inventory:
    build:
      context: .
      args:
        SERVICE: inventory
    environment:
      NODE_ENV: ${NODE_ENV}
      INVENTORY_SERVICE_PORT: ${INVENTORY_SERVICE_PORT}
      DATABASE_URL: ${INVENTORY_DATABASE_URL}
      KAFKA_BROKERS: ${KAFKA_BROKERS:-kafka:29092}
    ports:
      - "${INVENTORY_SERVICE_PORT}:${INVENTORY_SERVICE_PORT}"
    depends_on:
      inventory-db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:'+process.env.INVENTORY_SERVICE_PORT+'/api/v1/inventory/health').then((response)=>process.exit(response.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
    command:
      - sh
      - -c
      - |
        until node_modules/.bin/knex migrate:latest --knexfile knexfile.cjs; do
          echo "Waiting for inventory-db and retrying migrations..."
          sleep 2
        done
        node dist/index.js

  inventory-outbox-worker:
    build:
      context: .
      args:
        SERVICE: inventory
    environment:
      NODE_ENV: ${NODE_ENV}
      DATABASE_URL: ${INVENTORY_DATABASE_URL}
      KAFKA_BROKERS: ${KAFKA_BROKERS:-kafka:29092}
    depends_on:
      inventory:
        condition: service_healthy
      kafka:
        condition: service_healthy
    command:
      - sh
      - -c
      - |
        node dist/outbox/worker.js

  order-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${ORDER_DB_USER}
      POSTGRES_PASSWORD: ${ORDER_DB_PASSWORD}
      POSTGRES_DB: ${ORDER_DB_NAME}
    ports:
      - "${ORDER_DB_HOST_PORT}:5432"
    volumes:
      - order-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ORDER_DB_USER} -d ${ORDER_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 20

  payments-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${PAYMENTS_DB_USER}
      POSTGRES_PASSWORD: ${PAYMENTS_DB_PASSWORD}
      POSTGRES_DB: ${PAYMENTS_DB_NAME}
    ports:
      - "${PAYMENTS_DB_HOST_PORT}:5432"
    volumes:
      - payments-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PAYMENTS_DB_USER} -d ${PAYMENTS_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 20

  inventory-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${INVENTORY_DB_USER}
      POSTGRES_PASSWORD: ${INVENTORY_DB_PASSWORD}
      POSTGRES_DB: ${INVENTORY_DB_NAME}
    ports:
      - "${INVENTORY_DB_HOST_PORT}:5432"
    volumes:
      - inventory-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${INVENTORY_DB_USER} -d ${INVENTORY_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 20

  kafka:
    image: apache/kafka:4.0.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,PLAINTEXT_HOST://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    ports:
      - "${KAFKA_HOST_PORT:-9092}:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1",
        ]
      interval: 5s
      timeout: 10s
      retries: 30

volumes:
  order-db-data:
  payments-db-data:
  inventory-db-data:
  kafka-data:
