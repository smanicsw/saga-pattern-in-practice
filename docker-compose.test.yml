services:
  order-test-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: change_me_order
      POSTGRES_DB: order_test_db
    ports:
      - "${ORDER_TEST_DB_HOST_PORT:-5437}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d order_test_db"]
      interval: 5s
      timeout: 5s
      retries: 20

  order-saga-test-db:
    image: postgres:16-alpine
